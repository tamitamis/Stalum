{% extends 'portal/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <i class="bi bi-envelope-check text-success fs-1 mb-3"></i>
            <h3 class="fw-bold">Check your inbox</h3>
            <p class="text-muted">We've emailed you instructions for setting your password, if an account exists with the email you entered.</p>
            <p class="small text-muted">If you don't receive an email, please check your spam folder.</p>
            <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3 rounded-pill">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
