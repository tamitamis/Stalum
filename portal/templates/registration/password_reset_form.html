{% extends 'portal/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-3">Reset Password</h3>
                <p class="text-muted mb-4">Enter your email address and we'll send you a link to reset your password.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.email }}
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary rounded-pill">Send Reset Link</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>document.querySelectorAll('input').forEach(i => { i.classList.add('form-control'); i.placeholder='Email Address'; });</script>
{% endblock %}
