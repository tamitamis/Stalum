{% extends 'portal/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-3">New Password</h3>
                <p class="text-muted">Please enter your new password twice.</p>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary rounded-pill">Change Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>document.querySelectorAll('input').forEach(i => i.classList.add('form-control'));</script>
{% endblock %}
